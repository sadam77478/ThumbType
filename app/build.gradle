plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thumbtype.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.sadam.thumbtype.mobile"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('THUMBTYPE_KEYSTORE') ?: 'thumbtype-release.jks')
            storePassword System.getenv('THUMBTYPE_STORE_PASSWORD') ?: 'ThumbType2026Secure'
            keyAlias System.getenv('THUMBTYPE_KEY_ALIAS') ?: 'thumbtype'
            keyPassword System.getenv('THUMBTYPE_KEY_PASSWORD') ?: 'ThumbType2026Secure'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
}
