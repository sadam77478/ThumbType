<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ThumbType</title><link rel="stylesheet" href="styles.css"></head><body><main><h1>ThumbType</h1><p class="sub">Mobile typing trainer — practice with your phone keyboard.</p><section class="stats"><div><b id="wpm">0</b><span>WPM</span></div><div><b id="acc">100%</b><span>Accuracy</span></div><div><b id="best">0</b><span>Best WPM</span></div></section><section class="card"><div class="row"><strong id="lessonTitle">Lesson 1 · Everyday words</strong><button id="next">Next</button></div><p id="target"></p><textarea id="input" rows="7" placeholder="Tap here and start typing…" spellcheck="false"></textarea><div class="row"><button id="restart">Restart</button><span id="result"></span></div></section><section class="card"><h2>Practice modes</h2><div class="modes"><button data-mode="speed">⚡ Speed</button><button data-mode="accuracy">🎯 Accuracy</button><button data-mode="numbers">🔢 Numbers</button><button data-mode="punctuation">✍ Punctuation</button></div></section></main><script src="app.js"></script></body></html>
