name: Phase 7 Analytics Correctness Migration

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update analytics persistence and UI wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('app/src/main/java/com/sadam/thumbtype/mobile/AppRepository.kt')
          s = repo.read_text()
          s = s.replace('put(key[0], KeyAggregate(s.optInt("presses", 0), s.optInt("errors", 0), s.optLong("totalReactionMs", 0L)))', 'put(key[0], decodeKeyAggregate(s))')
          s = s.replace('put(key.take(4), TransitionAggregate(s.optInt("count", 0), s.optInt("errors", 0), s.optLong("totalMs", 0L)))', 'put(key.take(4), decodeTransitionAggregate(s))')
          s = s.replace('''            keys[key] = KeyAggregate(\n                presses = old.presses + update.presses,\n                errors = old.errors + update.errors,\n                totalReactionMs = old.totalReactionMs + update.totalReactionMs\n            )''', '''            keys[key] = KeyAggregate(\n                attempts = old.attempts + update.attempts,\n                correct = old.correct + update.correct,\n                errors = old.errors + update.errors,\n                totalCorrectReactionMs = old.totalCorrectReactionMs + update.totalCorrectReactionMs\n            )''')
          s = s.replace('''            transitions[pair] = TransitionAggregate(\n                count = old.count + update.count,\n                errors = old.errors + update.errors,\n                totalMs = old.totalMs + update.totalMs\n            )''', '''            transitions[pair] = TransitionAggregate(\n                attempts = old.attempts + update.attempts,\n                correct = old.correct + update.correct,\n                errors = old.errors + update.errors,\n                totalSuccessfulMs = old.totalSuccessfulMs + update.totalSuccessfulMs\n            )''')
          s = s.replace('it.value.presses + it.value.errors >= 2', 'it.value.attempts >= 2')
          s = s.replace('it.value.errors * 650 + it.value.averageReactionMs', 'it.value.errorRate * 12 + it.value.averageReactionMs')
          s = s.replace('it.value.count + it.value.errors >= 2', 'it.value.attempts >= 2')
          s = s.replace('it.value.errors * 700 + it.value.averageMs', 'it.value.errorRate * 14 + it.value.averageMs')
          s = s.replace('.put("version", 3)', '.put("version", 4)')
          s = s.replace('in 1..3', 'in 1..4')
          old_key_json = '''            put(key.toString(), JSONObject()\n                .put("presses", s.presses)\n                .put("errors", s.errors)\n                .put("totalReactionMs", s.totalReactionMs))'''
          new_key_json = '''            put(key.toString(), JSONObject()\n                .put("attempts", s.attempts)\n                .put("correct", s.correct)\n                .put("errors", s.errors)\n                .put("totalCorrectReactionMs", s.totalCorrectReactionMs))'''
          s = s.replace(old_key_json, new_key_json)
          old_transition_json = '''            put(pair, JSONObject()\n                .put("count", s.count)\n                .put("errors", s.errors)\n                .put("totalMs", s.totalMs))'''
          new_transition_json = '''            put(pair, JSONObject()\n                .put("attempts", s.attempts)\n                .put("correct", s.correct)\n                .put("errors", s.errors)\n                .put("totalSuccessfulMs", s.totalSuccessfulMs))'''
          s = s.replace(old_transition_json, new_transition_json)
          helper_anchor = '    private fun historyToJson(items: List<HistoryEntry>): JSONArray = JSONArray().apply {'
          helpers = '''    private fun decodeKeyAggregate(source: JSONObject): KeyAggregate {\n        if (source.has("attempts")) {\n            val attempts = source.optInt("attempts", 0).coerceAtLeast(0)\n            val correct = source.optInt("correct", 0).coerceIn(0, attempts)\n            val errors = source.optInt("errors", attempts - correct).coerceIn(0, attempts)\n            return KeyAggregate(\n                attempts = attempts,\n                correct = correct,\n                errors = errors,\n                totalCorrectReactionMs = source.optLong("totalCorrectReactionMs", 0L).coerceAtLeast(0L)\n            )\n        }\n\n        // V1-V3 migration: legacy `presses` counted successful presses, not attempts.\n        val legacyCorrect = source.optInt("presses", 0).coerceAtLeast(0)\n        val legacyErrors = source.optInt("errors", 0).coerceAtLeast(0)\n        return KeyAggregate(\n            attempts = legacyCorrect + legacyErrors,\n            correct = legacyCorrect,\n            errors = legacyErrors,\n            totalCorrectReactionMs = source.optLong("totalReactionMs", 0L).coerceAtLeast(0L)\n        )\n    }\n\n    private fun decodeTransitionAggregate(source: JSONObject): TransitionAggregate {\n        if (source.has("attempts")) {\n            val attempts = source.optInt("attempts", 0).coerceAtLeast(0)\n            val correct = source.optInt("correct", 0).coerceIn(0, attempts)\n            val errors = source.optInt("errors", attempts - correct).coerceIn(0, attempts)\n            return TransitionAggregate(\n                attempts = attempts,\n                correct = correct,\n                errors = errors,\n                totalSuccessfulMs = source.optLong("totalSuccessfulMs", 0L).coerceAtLeast(0L)\n            )\n        }\n\n        // V1-V3 migration: legacy `count` represented successful transitions.\n        val legacyCorrect = source.optInt("count", 0).coerceAtLeast(0)\n        val legacyErrors = source.optInt("errors", 0).coerceAtLeast(0)\n        return TransitionAggregate(\n            attempts = legacyCorrect + legacyErrors,\n            correct = legacyCorrect,\n            errors = legacyErrors,\n            totalSuccessfulMs = source.optLong("totalMs", 0L).coerceAtLeast(0L)\n        )\n    }\n\n'''
          if 'decodeKeyAggregate(source: JSONObject)' not in s:
              s = s.replace(helper_anchor, helpers + helper_anchor)
          for banned in ['.presses', '.count +', '.totalReactionMs', '.totalMs']:
              if banned in s:
                  raise SystemExit(f'Legacy aggregate reference remains in AppRepository: {banned}')
          repo.write_text(s)

          trainer = Path('app/src/main/java/com/sadam/thumbtype/mobile/TrainerScreen.kt')
          s = trainer.read_text()
          s = s.replace('TrainingKeyboard(expected,recommendation,layer,shift,settings,onLayer={layer=if(layer==KeyboardLayer.LETTERS)KeyboardLayer.NUMBERS else KeyboardLayer.LETTERS;wrong=false},onShift={shift=!shift;wrong=false})', 'TrainingKeyboard(expected,recommendation,layer,shift,settings,onLayer={layer=if(layer==KeyboardLayer.LETTERS)KeyboardLayer.NUMBERS else KeyboardLayer.LETTERS;wrong=false},onShift={shift=!shift;wrong=false},onBackspace={wrong=false})')
          s = s.replace('PressEvent(expected,entered,ok,(time-lastAt).coerceAtLeast(1),recommendation,touchSide)', 'PressEvent(expected,entered,ok,(time-lastAt).coerceAtLeast(1),recommendation,touchSide,targetIndex=index)')
          s = s.replace('settings:AppSettings,onLayer:()->Unit,onShift:()->Unit,onKey:', 'settings:AppSettings,onLayer:()->Unit,onShift:()->Unit,onBackspace:()->Unit,onKey:')
          s = s.replace('SpecialKey("⌫",false,Modifier.weight(1.15f),{})', 'SpecialKey("⌫",wrongActive = false,modifier = Modifier.weight(1.15f),onClick = onBackspace)')
          # Preserve compact helper signature by renaming its second parameter for the named call.
          s = s.replace('@Composable private fun SpecialKey(label:String,active:Boolean,modifier:Modifier,onClick:()->Unit)', '@Composable private fun SpecialKey(label:String,wrongActive:Boolean,modifier:Modifier,onClick:()->Unit)')
          s = s.replace('color=if(active)ThumbAmber.copy(.18f)else', 'color=if(wrongActive)ThumbAmber.copy(.18f)else')
          s = s.replace('color=if(active)ThumbAmber else', 'color=if(wrongActive)ThumbAmber else')
          # Existing calls are positional and remain valid after the parameter rename.
          if 'targetIndex=index' not in s or 'onBackspace' not in s:
              raise SystemExit('Trainer analytics wiring incomplete')
          trainer.write_text(s)

          components = Path('app/src/main/java/com/sadam/thumbtype/mobile/Components.kt')
          s = components.read_text()
          s = s.replace('it.errors * 500 + it.averageReactionMs', 'it.errorRate * 12 + it.averageReactionMs')
          s = s.replace('stat.errors * 500 + stat.averageReactionMs', 'stat.errorRate * 12 + stat.averageReactionMs')
          s = s.replace('DetailLine("Presses", stat.presses.toString())', 'DetailLine("Attempts", stat.attempts.toString())\n                DetailLine("Correct", stat.correct.toString())')
          if '.presses' in s:
              raise SystemExit('Legacy presses reference remains in Components')
          components.write_text(s)

          secondary = Path('app/src/main/java/com/sadam/thumbtype/mobile/ScreensSecondary.kt')
          s = secondary.read_text()
          old = 'DetailLine("Raw WPM","${result.rawWpm}");DetailLine("Mistakes","${result.mistakes}");DetailLine("Characters","${result.chars}")'
          new = 'DetailLine("Raw WPM","${result.rawWpm}");DetailLine("Attempts","${result.attempts}");DetailLine("Mistakes","${result.mistakes}");DetailLine("Recovered mistakes","${result.correctedErrors}");DetailLine("Unresolved mistakes","${result.uncorrectedErrors}");DetailLine("Correct characters","${result.chars}")'
          if old not in s:
              raise SystemExit('Results performance block not found')
          secondary.write_text(s.replace(old, new))

          build = Path('app/build.gradle')
          s = build.read_text()
          s = s.replace('versionCode 20', 'versionCode 21')
          s = s.replace('versionName "3.0-elite"', 'versionName "3.5-analytics"')
          if "testImplementation 'junit:junit:4.13.2'" not in s:
              s = s.replace("    debugImplementation 'androidx.compose.ui:ui-tooling'", "    testImplementation 'junit:junit:4.13.2'\n    debugImplementation 'androidx.compose.ui:ui-tooling'")
          build.write_text(s)
          PY

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sadam/thumbtype/mobile/AppRepository.kt app/src/main/java/com/sadam/thumbtype/mobile/TrainerScreen.kt app/src/main/java/com/sadam/thumbtype/mobile/Components.kt app/src/main/java/com/sadam/thumbtype/mobile/ScreensSecondary.kt app/build.gradle
          git commit -m "Migrate app to corrected analytics semantics"
          git push
