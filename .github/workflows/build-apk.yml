name: Validate and Package ThumbType V3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run analytics unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Package verified Android Studio project
        run: |
          rm -rf package-root
          mkdir -p package-root/ThumbType_V3_Elite_Verified
          cp -R app package-root/ThumbType_V3_Elite_Verified/
          cp build.gradle settings.gradle gradle.properties README.md package-root/ThumbType_V3_Elite_Verified/
          cp gradlew gradlew.bat package-root/ThumbType_V3_Elite_Verified/
          cp -R gradle package-root/ThumbType_V3_Elite_Verified/
          rm -rf package-root/ThumbType_V3_Elite_Verified/app/build
          cd package-root
          zip -r ../ThumbType-V3-Elite-Verified-Android-Studio.zip ThumbType_V3_Elite_Verified

      - uses: actions/upload-artifact@v4
        with:
          name: ThumbType-V3-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ThumbType-V3-Elite-Verified-Android-Studio
          path: ThumbType-V3-Elite-Verified-Android-Studio.zip
          if-no-files-found: error
