name: Validate and Package ThumbType

on:
  workflow_dispatch:
  push:
    branches: [ "main", "work/v5-trainer-rebuild" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run deterministic unit and Robolectric tests
        run: gradle testDebugUnitTest

      - name: Run Android lint
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Compile instrumentation test APK
        run: gradle assembleDebugAndroidTest

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android journeys and capture V5 trainer
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle installDebug installDebugAndroidTest
            adb shell am instrument -w com.sadam.thumbtype.mobile.debug.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p visual-artifacts
            adb exec-out run-as com.sadam.thumbtype.mobile.debug cat files/thumbtype-v5-trainer.png > visual-artifacts/thumbtype-v5-trainer.png
            file visual-artifacts/thumbtype-v5-trainer.png | grep -q 'PNG image data'
            test $(stat -c%s visual-artifacts/thumbtype-v5-trainer.png) -gt 10000

      - name: Build minified release APK
        run: gradle assembleRelease

      - name: Enforce APK size budgets
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          DEBUG_BYTES=$(stat -c%s "$DEBUG_APK")
          RELEASE_BYTES=$(stat -c%s "$RELEASE_APK")
          DEBUG_BUDGET=$((30 * 1024 * 1024))
          RELEASE_BUDGET=$((25 * 1024 * 1024))
          printf "ThumbType V5 trainer rebuild artifact report\n" > performance-ci.txt
          printf "debug_apk_bytes=%s\n" "$DEBUG_BYTES" >> performance-ci.txt
          printf "release_apk_bytes=%s\n" "$RELEASE_BYTES" >> performance-ci.txt
          printf "debug_budget_bytes=%s\n" "$DEBUG_BUDGET" >> performance-ci.txt
          printf "release_budget_bytes=%s\n" "$RELEASE_BUDGET" >> performance-ci.txt
          cat performance-ci.txt
          test "$DEBUG_BYTES" -le "$DEBUG_BUDGET"
          test "$RELEASE_BYTES" -le "$RELEASE_BUDGET"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Package Android Studio project
        run: |
          rm -rf package-root
          mkdir -p package-root/ThumbType_V5_Trainer_Rebuild
          cp -R app package-root/ThumbType_V5_Trainer_Rebuild/
          cp build.gradle settings.gradle gradle.properties README.md package-root/ThumbType_V5_Trainer_Rebuild/
          cp gradlew gradlew.bat package-root/ThumbType_V5_Trainer_Rebuild/
          cp -R gradle package-root/ThumbType_V5_Trainer_Rebuild/
          if [ -d docs ]; then cp -R docs package-root/ThumbType_V5_Trainer_Rebuild/; fi
          cp performance-ci.txt package-root/ThumbType_V5_Trainer_Rebuild/
          cp visual-artifacts/thumbtype-v5-trainer.png package-root/ThumbType_V5_Trainer_Rebuild/
          rm -rf package-root/ThumbType_V5_Trainer_Rebuild/app/build
          cd package-root
          zip -r ../ThumbType-V5-Trainer-Rebuild-Android-Studio.zip ThumbType_V5_Trainer_Rebuild

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ThumbType-V5-Test-Reports
          path: |
            app/build/reports
            app/build/outputs/androidTest-results
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ThumbType-V5-Trainer-Visual-Review
          path: visual-artifacts/thumbtype-v5-trainer.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: ThumbType-V5-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ThumbType-V5-Release-Unsigned-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ThumbType-V5-Performance-Report
          path: performance-ci.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ThumbType-V5-Trainer-Rebuild-Android-Studio
          path: ThumbType-V5-Trainer-Rebuild-Android-Studio.zip
          if-no-files-found: error
