name: Build ThumbType Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk ThumbType-v1.1-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThumbType-Release-APK
          path: ThumbType-v1.1-release.apk
          if-no-files-found: error
