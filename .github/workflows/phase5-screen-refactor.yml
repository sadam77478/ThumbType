name: Phase 5 Screen Read-Model Refactor

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor feature screens away from repository access
        run: |
          python3 - <<'PY'
          from pathlib import Path

          primary = Path('app/src/main/java/com/sadam/thumbtype/mobile/ScreensPrimary.kt')
          s = primary.read_text()
          anchor = 'import androidx.compose.ui.unit.dp\n'
          if 'import com.sadam.thumbtype.mobile.app.HomeUiData' not in s:
              s = s.replace(anchor, anchor + 'import com.sadam.thumbtype.mobile.app.HomeUiData\nimport com.sadam.thumbtype.mobile.app.LearnUiData\nimport com.sadam.thumbtype.mobile.app.PracticeUiData\n')
          s = s.replace('fun HomeScreen(repo:AppRepository,refresh:Int,onStart:(Lesson)->Unit,onNavigate:(AppScreen)->Unit)', 'fun HomeScreen(data:HomeUiData,onStart:(Lesson)->Unit,onNavigate:(AppScreen)->Unit)')
          s = s.replace('fun LearnScreen(repo:AppRepository,refresh:Int,onStart:(Lesson)->Unit)', 'fun LearnScreen(data:LearnUiData,onStart:(Lesson)->Unit)')
          s = s.replace('fun PracticeScreen(repo:AppRepository,onStart:(Lesson)->Unit)', 'fun PracticeScreen(data:PracticeUiData,onStart:(Lesson)->Unit)')
          for old, new in {
              'repo.profile()':'data.profile',
              'repo.completedLessonIds()':'data.completedLessonIds',
              'repo.dailyWorkout()':'data.workout',
              'repo.todaySeconds()':'data.todaySeconds',
              'repo.currentThumbScore()':'data.thumbScore',
              'repo.streak()':'data.streak',
              'repo.lastWpm()':'data.lastWpm',
              'repo.lastAccuracy()':'data.lastAccuracy',
              'repo.bestWpm()':'data.bestWpm',
              'repo.xp()':'data.xp',
              'repo.totalCharacters()':'data.totalCharacters',
          }.items():
              s = s.replace(old, new)
          s = s.replace('val weak=remember(repo.keyStats(),repo.transitionStats()){TrainingEngine.generateWeakDrill(repo.keyStats(),repo.transitionStats())}', 'val weak=data.weakDrill')
          if 'repo.' in s or 'AppRepository' in s or 'refresh:Int' in s:
              raise SystemExit('Primary screen refactor incomplete')
          primary.write_text(s)

          secondary = Path('app/src/main/java/com/sadam/thumbtype/mobile/ScreensSecondary.kt')
          s = secondary.read_text()
          anchor = 'import androidx.compose.ui.unit.sp\n'
          if 'import com.sadam.thumbtype.mobile.app.ProfileUiData' not in s:
              s = s.replace(anchor, anchor + 'import com.sadam.thumbtype.mobile.app.ProfileUiData\nimport com.sadam.thumbtype.mobile.app.ProgressUiData\n')
          s = s.replace('fun ProgressScreen(repo:AppRepository,refresh:Int)', 'fun ProgressScreen(data:ProgressUiData)')
          s = s.replace('fun ProfileScreen(repo:AppRepository,settings:AppSettings,profile:UserProfile', 'fun ProfileScreen(data:ProfileUiData,settings:AppSettings,profile:UserProfile')
          for old, new in {
              'repo.history()':'data.history',
              'repo.keyStats()':'data.keyStats',
              'repo.topWeakTransitions()':'data.weakTransitions',
              'repo.profile()':'data.profile',
              'repo.lastWpm()':'data.lastWpm',
              'repo.bestWpm()':'data.bestWpm',
              'repo.currentThumbScore()':'data.thumbScore',
              'repo.achievements()':'data.achievements',
              'repo.xp()':'data.xp',
          }.items():
              s = s.replace(old, new)
          if 'repo.' in s or 'AppRepository' in s or 'refresh:Int' in s:
              raise SystemExit('Secondary screen refactor incomplete')
          secondary.write_text(s)
          PY

      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sadam/thumbtype/mobile/ScreensPrimary.kt app/src/main/java/com/sadam/thumbtype/mobile/ScreensSecondary.kt
          git commit -m "Decouple feature screens from repository reads"
          git push
